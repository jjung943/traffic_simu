<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Simulation</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      color: #eee;
    }
    h1 { margin-bottom: 6px; font-size: 1.4rem; letter-spacing: 0.05em; }
    p.subtitle { margin: 0 0 14px; font-size: 0.82rem; color: #aaa; }
    canvas { border: 2px solid #444; border-radius: 4px; display: block; }
    #status {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #aaa;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <h1>Traffic Simulation — Highway</h1>
  <p class="subtitle">Highway · On/Off Ramp · Collision detection · No stopping in merge zone</p>
  <canvas id="sim" width="900" height="420"></canvas>
  <div id="status">Running…</div>

  <script>
  (() => {
    // ── Canvas ────────────────────────────────────────────────────────────────
    const canvas = document.getElementById('sim');
    const ctx    = canvas.getContext('2d');
    const W = canvas.width;   // 900
    const H = canvas.height;  // 420

    // ── Layout ────────────────────────────────────────────────────────────────
    const LANE_H   = 34;
    const HWY_TOP  = H / 2 - LANE_H;
    const HWY_BOT  = H / 2 + LANE_H;
    const HWY_MID  = H / 2;
    const LANE1_CY = HWY_TOP + LANE_H / 2;   // lane 1 centre y (→)
    const LANE2_CY = HWY_MID + LANE_H / 2;   // lane 2 centre y (←)

    // Car dimensions
    const CAR_W = 38;
    const CAR_H = 18;
    const FOLLOW_GAP = 10;

    // Ramp merge / split x positions
    const MERGE_X = 260;
    const SPLIT_X = 640;
    const RAMP_BOTTOM_Y = H - 40;

    // On-ramp origin (bottom-left)
    const RAMP_ON_X0  = MERGE_X - 210;
    const RAMP_ON_Y0  = RAMP_BOTTOM_Y;
    // On-ramp destination (highway lane 1 at MERGE_X)
    const RAMP_ON_X1  = MERGE_X;
    const RAMP_ON_Y1  = LANE1_CY;

    // Off-ramp origin (highway lane 1 at SPLIT_X)
    const RAMP_OFF_X0 = SPLIT_X;
    const RAMP_OFF_Y0 = LANE1_CY;
    // Off-ramp destination (bottom-right)
    const RAMP_OFF_X1 = SPLIT_X + 210;
    const RAMP_OFF_Y1 = RAMP_BOTTOM_Y;

    // Merge zone: cars inside this range on lane 1 must not stop
    const MERGE_ZONE_X1 = MERGE_X - 50;
    const MERGE_ZONE_X2 = MERGE_X + 50;
    const SPLIT_ZONE_X1 = SPLIT_X - 50;
    const SPLIT_ZONE_X2 = SPLIT_X + 50;

    // Minimum gap in lane 1 required for an on-ramp car to merge
    const MERGE_CLEAR = CAR_W + 60;

    // ── State ─────────────────────────────────────────────────────────────────
    let crashed    = false;
    let crashPairs = [];
    let nextId     = 0;

    // ── Car factory ──────────────────────────────────────────────────────────
    // type: 'h1' (→), 'h2' (←), 'onramp' (progress 0→1), 'offramp' (progress 0→1)
    function makeCar(type, pos, speed, color) {
      return { id: nextId++, type, pos, speed, color };
    }

    function rndColor() {
      const p = ['#E74C3C','#E67E22','#9B59B6','#3498DB','#1ABC9C',
                 '#F39C12','#2ECC71','#E91E63','#00BCD4','#CDDC39'];
      return p[Math.floor(Math.random() * p.length)];
    }

    // ── Initial cars ─────────────────────────────────────────────────────────
    const cars = [
      // Lane 1 (→) — staggered starts well off screen
      makeCar('h1', -100,  2.2, '#E74C3C'),
      makeCar('h1', -320,  2.0, '#E67E22'),
      makeCar('h1', -560,  2.3, '#9B59B6'),
      makeCar('h1', -800,  1.9, '#F39C12'),
      // Lane 2 (←)
      makeCar('h2', W+100, 2.1, '#3498DB'),
      makeCar('h2', W+340, 1.8, '#1ABC9C'),
      makeCar('h2', W+580, 2.2, '#E91E63'),
      makeCar('h2', W+820, 2.0, '#00BCD4'),
      // On-ramp cars: progress = 0 (bottom) → 1 (merge point)
      // Start them well below 0 so they don't immediately merge
      makeCar('onramp', -0.4, 0.006, '#2ECC71'),
      makeCar('onramp', -0.9, 0.007, '#CDDC39'),
    ];

    // ── Geometry helpers ──────────────────────────────────────────────────────
    function rampPos(progress, type) {
      if (type === 'onramp') {
        return {
          x: RAMP_ON_X0  + (RAMP_ON_X1  - RAMP_ON_X0)  * progress,
          y: RAMP_ON_Y0  + (RAMP_ON_Y1  - RAMP_ON_Y0)  * progress,
        };
      }
      return {
        x: RAMP_OFF_X0 + (RAMP_OFF_X1 - RAMP_OFF_X0) * progress,
        y: RAMP_OFF_Y0 + (RAMP_OFF_Y1 - RAMP_OFF_Y0) * progress,
      };
    }

    // Tight axis-aligned bounding box for collision detection
    // Ramp cars use a small square; highway cars use a slim rectangle
    function getBBox(car) {
      const PAD = 2; // shrink box slightly to avoid edge-touch false positives
      if (car.type === 'h1') {
        return { x: car.pos + PAD, y: LANE1_CY - CAR_H/2 + PAD,
                 w: CAR_W - PAD*2, h: CAR_H - PAD*2 };
      }
      if (car.type === 'h2') {
        return { x: car.pos + PAD, y: LANE2_CY - CAR_H/2 + PAD,
                 w: CAR_W - PAD*2, h: CAR_H - PAD*2 };
      }
      // Ramp cars: only check when visible on canvas
      const { x, y } = rampPos(car.pos, car.type);
      const S = CAR_H / 2 - PAD;
      return { x: x - S, y: y - S, w: S*2, h: S*2 };
    }

    function boxesOverlap(a, b) {
      return !(a.x + a.w <= b.x || b.x + b.w <= a.x ||
               a.y + a.h <= b.y || b.y + b.h <= a.y);
    }

    // ── Update ────────────────────────────────────────────────────────────────
    function updateCars() {
      // Sorted lane arrays for leader-following
      const lane1 = cars.filter(c => c.type === 'h1').sort((a,b) => b.pos - a.pos);
      const lane2 = cars.filter(c => c.type === 'h2').sort((a,b) => a.pos - b.pos);

      // --- Lane 1 (→) ---
      lane1.forEach((car, i) => {
        const leader = lane1[i - 1];
        let maxMove  = car.speed;

        if (leader) {
          const gap = leader.pos - (car.pos + CAR_W) - FOLLOW_GAP;
          maxMove = Math.min(maxMove, Math.max(0, gap));
        }

        // No stopping inside merge or split zone
        const inZone = (car.pos + CAR_W > MERGE_ZONE_X1 && car.pos < MERGE_ZONE_X2) ||
                       (car.pos + CAR_W > SPLIT_ZONE_X1 && car.pos < SPLIT_ZONE_X2);
        if (inZone) maxMove = Math.max(maxMove, 1);

        car.pos += maxMove;

        // Randomly convert to off-ramp when passing SPLIT_X
        if (car.pos >= SPLIT_X && car.pos < SPLIT_X + 10 && Math.random() < 0.35) {
          car.type  = 'offramp';
          car.pos   = 0;
          car.speed = 0.008 + Math.random() * 0.003;
        }

        if (car.pos > W + CAR_W) car.pos = -CAR_W - 20;
      });

      // --- Lane 2 (←) ---
      lane2.forEach((car, i) => {
        const leader = lane2[i - 1];
        let maxMove  = car.speed;

        if (leader) {
          const gap = car.pos - (leader.pos + CAR_W) - FOLLOW_GAP;
          maxMove = Math.min(maxMove, Math.max(0, gap));
        }

        car.pos -= maxMove;
        if (car.pos < -CAR_W * 2) car.pos = W + CAR_W + 20;
      });

      // --- On-ramp ---
      cars.filter(c => c.type === 'onramp').forEach(car => {
        // Only check gap when close to merge point
        if (car.pos > 0.75) {
          // Find nearest lane1 car to MERGE_X
          const blocked = lane1.some(hc => Math.abs(hc.pos - MERGE_X) < MERGE_CLEAR);
          if (blocked) return; // yield — wait on ramp
        }

        car.pos += car.speed;

        if (car.pos >= 1.0) {
          // Merge into lane 1
          car.type  = 'h1';
          car.pos   = MERGE_X;
          car.speed = 1.8 + Math.random() * 0.5;
          car.color = rndColor();
        }
      });

      // --- Off-ramp ---
      cars.filter(c => c.type === 'offramp').forEach(car => {
        car.pos += car.speed;
        if (car.pos > 1.1) {
          // Recycle as a new on-ramp car
          car.type  = 'onramp';
          car.pos   = -(0.3 + Math.random() * 0.7);
          car.speed = 0.005 + Math.random() * 0.003;
          car.color = rndColor();
        }
      });
    }

    // ── Collision detection ───────────────────────────────────────────────────
    // Only check cars that are actually on the visible highway surface
    // (skip ramp cars that haven't reached the highway yet)
    function isOnHighway(car) {
      if (car.type === 'h1' || car.type === 'h2') return true;
      // Ramp cars are "on highway" only once merged (handled by type change)
      return false;
    }

    function checkCollisions() {
      const active = cars.filter(isOnHighway);
      for (let i = 0; i < active.length; i++) {
        for (let j = i + 1; j < active.length; j++) {
          if (boxesOverlap(getBBox(active[i]), getBBox(active[j]))) {
            crashPairs.push([active[i], active[j]]);
          }
        }
      }
      if (crashPairs.length > 0) crashed = true;
    }

    // ── Draw ──────────────────────────────────────────────────────────────────
    function drawRoads() {
      // Grass
      ctx.fillStyle = '#2d5a27';
      ctx.fillRect(0, 0, W, H);

      // Highway surface
      ctx.fillStyle = '#555';
      ctx.fillRect(0, HWY_TOP, W, LANE_H * 2);

      // Edge lines
      ctx.strokeStyle = '#ddd';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, HWY_TOP); ctx.lineTo(W, HWY_TOP);
      ctx.moveTo(0, HWY_BOT); ctx.lineTo(W, HWY_BOT);
      ctx.stroke();

      // Centre dashes
      ctx.setLineDash([28, 18]);
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, HWY_MID); ctx.lineTo(W, HWY_MID);
      ctx.stroke();
      ctx.setLineDash([]);

      // Direction arrows
      ctx.fillStyle = 'rgba(255,255,255,0.13)';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      for (let ax = 70; ax < W; ax += 150) {
        ctx.fillText('→', ax, LANE1_CY + 6);
        ctx.fillText('←', ax, LANE2_CY + 6);
      }
      ctx.textAlign = 'left';

      // ── On-ramp surface ──
      ctx.fillStyle = '#4a4a4a';
      ctx.beginPath();
      ctx.moveTo(RAMP_ON_X0 - 12, RAMP_ON_Y0);
      ctx.lineTo(RAMP_ON_X0 + 12, RAMP_ON_Y0);
      ctx.lineTo(RAMP_ON_X1 + 10, RAMP_ON_Y1);
      ctx.lineTo(RAMP_ON_X1 - 10, RAMP_ON_Y1);
      ctx.closePath();
      ctx.fill();

      // ── Off-ramp surface ──
      ctx.fillStyle = '#4a4a4a';
      ctx.beginPath();
      ctx.moveTo(RAMP_OFF_X0 - 10, RAMP_OFF_Y0);
      ctx.lineTo(RAMP_OFF_X0 + 10, RAMP_OFF_Y0);
      ctx.lineTo(RAMP_OFF_X1 + 12, RAMP_OFF_Y1);
      ctx.lineTo(RAMP_OFF_X1 - 12, RAMP_OFF_Y1);
      ctx.closePath();
      ctx.fill();

      // Merge zone subtle highlight (lane 1 only)
      ctx.fillStyle = 'rgba(255,200,0,0.08)';
      ctx.fillRect(MERGE_ZONE_X1, HWY_TOP, MERGE_ZONE_X2 - MERGE_ZONE_X1, LANE_H);
      ctx.fillRect(SPLIT_ZONE_X1, HWY_TOP, SPLIT_ZONE_X2 - SPLIT_ZONE_X1, LANE_H);

      // Labels
      ctx.fillStyle = '#bbb';
      ctx.font = '11px sans-serif';
      ctx.fillText('ON RAMP',  RAMP_ON_X0  - 12, RAMP_ON_Y0  + 18);
      ctx.fillText('OFF RAMP', RAMP_OFF_X1 - 50, RAMP_OFF_Y1 + 18);
    }

    function drawCar(car) {
      if (car.type === 'h1' || car.type === 'h2') {
        const cy   = car.type === 'h1' ? LANE1_CY : LANE2_CY;
        const flip = car.type === 'h2';
        drawCarRect(car.pos, cy - CAR_H/2, CAR_W, CAR_H, car.color, flip);
        return;
      }
      if (car.type === 'onramp' || car.type === 'offramp') {
        if (car.pos < 0 || car.pos > 1.05) return; // off-screen
        const { x, y } = rampPos(car.pos, car.type);
        if (x < 0 || x > W || y < 0 || y > H) return;
        const s = CAR_H;
        drawCarRect(x - s/2, y - s/2, s, s, car.color, false);
      }
    }

    function drawCarRect(x, y, w, h, color, flip) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
      // Windshield
      ctx.fillStyle = '#AED6F1';
      if (!flip) ctx.fillRect(x + w - 13, y + 3, 9, h - 6);
      else       ctx.fillRect(x + 4,      y + 3, 9, h - 6);
      // Wheels
      ctx.fillStyle = '#111';
      ctx.fillRect(x + 4,      y + h - 3, 9, 5);
      ctx.fillRect(x + w - 13, y + h - 3, 9, 5);
    }

    function drawCrash() {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);

      // Highlight crashed cars
      crashPairs.forEach(([a, b]) => {
        [a, b].forEach(car => {
          const bb = getBBox(car);
          ctx.strokeStyle = '#FF4444';
          ctx.lineWidth = 3;
          ctx.strokeRect(bb.x - 5, bb.y - 5, bb.w + 10, bb.h + 10);
        });
      });

      // Banner
      const bw = 380, bh = 86;
      const bx = W/2 - bw/2, by = H/2 - bh/2;
      ctx.fillStyle = '#C0392B';
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 12);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 30px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('💥  CRASH — Simulation Stopped', W/2, by + 34);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = '#fdd';
      ctx.fillText('Two cars made contact. Reload the page to restart.', W/2, by + 62);
      ctx.textAlign = 'left';

      document.getElementById('status').innerHTML = '⚠️ Crash detected — simulation halted.';
      document.getElementById('status').style.color = '#E74C3C';
    }

    // ── Main loop ─────────────────────────────────────────────────────────────
    function update() {
      if (crashed) return;
      updateCars();
      checkCollisions();
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      drawRoads();
      cars.forEach(drawCar);
      if (crashed) drawCrash();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  })();
  </script>
</body>
</html>
