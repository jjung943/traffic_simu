<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Simulation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      font-family: sans-serif;
      color: #eee;
      overflow: hidden;
    }
    #header {
      text-align: center;
      padding: 8px 0 4px;
    }
    #header h1 { font-size: 1.15rem; letter-spacing: 0.05em; }
    #header p  { font-size: 0.75rem; color: #aaa; margin-top: 2px; }

    /* ── Top controls row ── */
    #top-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 5px;
      font-size: 0.82rem;
      color: #ccc;
    }
    #top-controls label { white-space: nowrap; }
    #volumeSlider {
      -webkit-appearance: none;
      width: 160px; height: 5px;
      border-radius: 3px;
      background: #444;
      outline: none;
      cursor: pointer;
    }
    #volumeSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px; height: 15px;
      border-radius: 50%;
      background: #3498DB;
      cursor: pointer;
    }
    #volumeVal { min-width: 22px; color: #3498DB; font-weight: bold; }

    /* ── DVR controls row ── */
    #dvr {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 5px 0 3px;
    }
    .dvr-btn {
      background: #2c2c4a;
      border: 1px solid #444;
      color: #ddd;
      font-size: 1.05rem;
      padding: 3px 10px;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .dvr-btn:hover  { background: #3a3a60; }
    .dvr-btn:active { background: #4a4a80; }
    .dvr-btn.active { background: #1a6a9a; border-color: #3498DB; }
    #scrubBar {
      -webkit-appearance: none;
      width: 340px; height: 5px;
      border-radius: 3px;
      background: #333;
      outline: none;
      cursor: pointer;
    }
    #scrubBar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #f39c12;
      cursor: pointer;
    }
    #dvr-label {
      font-size: 0.75rem;
      color: #888;
      min-width: 90px;
      text-align: left;
    }

    canvas { display: block; width: 100%; }
    #status {
      text-align: center;
      padding: 4px 0;
      font-size: 0.78rem;
      color: #aaa;
      min-height: 1.3em;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>Traffic Simulation — 4-Lane Highway</h1>
    <p>One-way (→) · 4 lanes · On/off ramp (lane 4) · Realism-first physics</p>
    <div id="top-controls">
      <label for="volumeSlider">Traffic Volume:</label>
      <input type="range" id="volumeSlider" min="1" max="10" value="5" step="1" />
      <span id="volumeVal">5</span>
      <span style="color:#555">| 1 = sparse &nbsp; 10 = overloaded</span>
    </div>
  </div>

  <!-- DVR controls -->
  <div id="dvr">
    <button class="dvr-btn" id="btnReset" title="Reset simulation">⏮ Reset</button>
    <button class="dvr-btn" id="btnPlay"  title="Play / Pause">⏸ Pause</button>
    <button class="dvr-btn" id="btnRew"   title="Click to start/stop rewind">◀◀ Rewind</button>
    <button class="dvr-btn" id="btnSpeed" title="Cycle playback speed">Speed: 1×</button>
    <input  type="range" id="scrubBar" min="0" max="1799" value="1799" step="1" />
    <span id="dvr-label">Live</span>
  </div>

  <canvas id="sim"></canvas>
  <div id="status">Running…</div>

  <script>
  (() => {
    // ── Canvas ────────────────────────────────────────────────────────────────
    const canvas   = document.getElementById('sim');
    const ctx      = canvas.getContext('2d');
    const headerEl = document.getElementById('header');
    const dvrEl    = document.getElementById('dvr');
    const STATUS_H = 24;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight
                      - headerEl.offsetHeight
                      - dvrEl.offsetHeight
                      - STATUS_H;
    }
    resize();
    window.addEventListener('resize', () => { resize(); initLayout(); });

    // ── Layout ────────────────────────────────────────────────────────────────
    const NUM_LANES = 4;
    const LANE_H    = 38;
    const HWY_H     = NUM_LANES * LANE_H;
    const RAMP_DROP = 100;

    let W, H, HWY_TOP, HWY_BOT;
    let MERGE_X, SPLIT_X;
    let RAMP_ON_X0, RAMP_ON_Y0, RAMP_ON_X1, RAMP_ON_Y1;
    let RAMP_OFF_X0, RAMP_OFF_Y0, RAMP_OFF_X1, RAMP_OFF_Y1;
    let MERGE_ZONE_X1, MERGE_ZONE_X2, SPLIT_ZONE_X1, SPLIT_ZONE_X2;
    let MERGE_CLEAR;

    function initLayout() {
      W       = canvas.width;
      H       = canvas.height;
      HWY_TOP = Math.round((H - HWY_H - RAMP_DROP) / 2);
      HWY_BOT = HWY_TOP + HWY_H;

      MERGE_X = Math.round(W * 0.25);
      SPLIT_X = Math.round(W * 0.75);

      RAMP_ON_X0  = MERGE_X - RAMP_DROP;
      RAMP_ON_Y0  = HWY_BOT + RAMP_DROP;
      RAMP_ON_X1  = MERGE_X;
      RAMP_ON_Y1  = laneCY(4);

      RAMP_OFF_X0 = SPLIT_X;
      RAMP_OFF_Y0 = laneCY(4);
      RAMP_OFF_X1 = SPLIT_X + RAMP_DROP;
      RAMP_OFF_Y1 = HWY_BOT + RAMP_DROP;

      MERGE_ZONE_X1 = MERGE_X - 60;
      MERGE_ZONE_X2 = MERGE_X + 60;
      SPLIT_ZONE_X1 = SPLIT_X - 60;
      SPLIT_ZONE_X2 = SPLIT_X + 60;

      MERGE_CLEAR = CAR_W + 120;
    }

    function laneCY(n) { return HWY_TOP + (n - 1) * LANE_H + LANE_H / 2; }

    // ── Car dimensions ────────────────────────────────────────────────────────
    const CAR_W      = 42;
    const CAR_H      = 22;
    const FOLLOW_GAP = 12;

    // ── Simulation state ──────────────────────────────────────────────────────
    let cars       = [];
    let crashed    = false;
    let hasCrashed = false; // latches true permanently once a crash occurs; cleared only on Reset
    let crashPairs = [];   // pairs at crash frame (for overlay)
    let nextId     = 0;

    // ── DVR / playback state ──────────────────────────────────────────────────
    // mode: 'live' | 'paused' | 'rewinding' | 'replay'
    let mode          = 'live';
    const HISTORY_MAX = 1800;          // ~30 s at 60 fps
    const history     = [];            // ring buffer of snapshots
    let   histHead    = 0;             // index of oldest entry (circular)
    let   histLen     = 0;             // number of valid entries
    let   playHead    = 0;             // current playback position (0 = oldest)

    // Speed multiplier: applies to both live playback (forward) and rewind.
    // At Nx speed, updateCars() is called N times per render frame (forward)
    // or history is stepped N frames per render frame (rewind).
    const SPEEDS      = [1, 2, 4];
    let   speedIdx    = 0;             // index into SPEEDS array
    function speed()  { return SPEEDS[speedIdx]; }

    // Snapshot: deep-copy the cars array (only the fields needed for rendering)
    function snapshot() {
      return cars.map(c => ({ ...c }));
    }

    // Push a snapshot into the ring buffer
    function pushHistory(snap) {
      const idx = (histHead + histLen) % HISTORY_MAX;
      history[idx] = snap;
      if (histLen < HISTORY_MAX) {
        histLen++;
      } else {
        histHead = (histHead + 1) % HISTORY_MAX; // overwrite oldest
      }
      playHead = histLen - 1; // always point to latest when live
    }

    // Retrieve snapshot at logical position pos (0 = oldest, histLen-1 = newest)
    function getSnapshot(pos) {
      const idx = (histHead + pos) % HISTORY_MAX;
      return history[idx] || [];
    }

    // Restore cars array from a snapshot (for scrubbing)
    function restoreSnapshot(pos) {
      const snap = getSnapshot(pos);
      cars.length = 0;
      snap.forEach(c => cars.push({ ...c }));
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    const COLORS = ['#E74C3C','#E67E22','#9B59B6','#3498DB','#1ABC9C',
                    '#F39C12','#2ECC71','#E91E63','#00BCD4','#CDDC39','#FF5722'];
    function rndColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

    function makeCar(type, pos, speed, color) {
      const id = nextId++;
      // Color is deterministic: same car ID always gets the same color.
      // This ensures colors don't change when rewinding and replaying.
      const assignedColor = color || COLORS[id % COLORS.length];
      return { id, type, pos, speed, color: assignedColor };
    }

    function rampPos(progress, type) {
      if (type === 'onramp') {
        return {
          x: RAMP_ON_X0  + (RAMP_ON_X1  - RAMP_ON_X0)  * progress,
          y: RAMP_ON_Y0  + (RAMP_ON_Y1  - RAMP_ON_Y0)  * progress,
        };
      }
      return {
        x: RAMP_OFF_X0 + (RAMP_OFF_X1 - RAMP_OFF_X0) * progress,
        y: RAMP_OFF_Y0 + (RAMP_OFF_Y1 - RAMP_OFF_Y0) * progress,
      };
    }

    // ── Traffic volume slider ─────────────────────────────────────────────────
    const sliderEl  = document.getElementById('volumeSlider');
    const volumeVal = document.getElementById('volumeVal');
    let trafficVolume = parseInt(sliderEl.value, 10);
    sliderEl.addEventListener('input', () => {
      trafficVolume = parseInt(sliderEl.value, 10);
      volumeVal.textContent = trafficVolume;
    });

    function spawnInterval() {
      const base = Math.round(300 - (trafficVolume - 1) * (270 / 9));
      return base + Math.floor(Math.random() * 30);
    }
    function maxCarsPerLane() {
      return 2 + Math.round((trafficVolume - 1) * (10 / 9));
    }

    // ── Spawn system ──────────────────────────────────────────────────────────
    let spawnTimers = { 1: 0, 2: 30, 3: 60, 4: 90 };

    function trySpawnLane(n) {
      spawnTimers[n]--;
      if (spawnTimers[n] > 0) return;
      const laneCars = cars.filter(c => c.type === `lane${n}`);
      if (laneCars.length >= maxCarsPerLane()) {
        spawnTimers[n] = spawnInterval();
        return;
      }
      const blocked = laneCars.some(c => c.pos < CAR_W + FOLLOW_GAP * 3);
      if (!blocked) {
        const speed = 1.8 + Math.random() * 0.7;
        cars.push(makeCar(`lane${n}`, -CAR_W, speed));
      }
      spawnTimers[n] = spawnInterval();
    }

    function seedInitialCars() {
      const offsets = [100, 320, 580, 860, 1150];
      for (let n = 1; n <= 4; n++) {
        offsets.forEach(off => {
          cars.push(makeCar(`lane${n}`, -off, 1.8 + Math.random() * 0.7));
        });
      }
      cars.push(makeCar('onramp', -0.30, 0.006));
      cars.push(makeCar('onramp', -0.75, 0.007));
    }

    // ── Bounding boxes ────────────────────────────────────────────────────────
    function getBBox(car) {
      const PAD = 1;
      if (car.type.startsWith('lane')) {
        const n  = parseInt(car.type.slice(4));
        const cy = laneCY(n);
        return { x: car.pos + PAD, y: cy - CAR_H / 2 + PAD,
                 w: CAR_W - PAD * 2, h: CAR_H - PAD * 2 };
      }
      const { x, y } = rampPos(car.pos, car.type);
      const S = CAR_H / 2 - PAD;
      return { x: x - S, y: y - S, w: S * 2, h: S * 2 };
    }

    function boxesOverlap(a, b) {
      return !(a.x + a.w <= b.x || b.x + b.w <= a.x ||
               a.y + a.h <= b.y || b.y + b.h <= a.y);
    }

    // ── Update ────────────────────────────────────────────────────────────────
    function updateCars() {
      const lanes = {};
      for (let n = 1; n <= 4; n++) {
        lanes[n] = cars.filter(c => c.type === `lane${n}`)
                       .sort((a, b) => b.pos - a.pos);
      }

      for (let n = 1; n <= 4; n++) {
        lanes[n].forEach((car, i) => {
          const leader = lanes[n][i - 1];
          let maxMove  = car.speed;

          if (leader) {
            const gap = leader.pos - (car.pos + CAR_W) - FOLLOW_GAP;
            maxMove = Math.min(maxMove, Math.max(0, gap));
          }

          if (n === 4) {
            const inZone = (car.pos + CAR_W > MERGE_ZONE_X1 && car.pos < MERGE_ZONE_X2) ||
                           (car.pos + CAR_W > SPLIT_ZONE_X1 && car.pos < SPLIT_ZONE_X2);
            if (inZone) maxMove = Math.max(maxMove, 1);
          }

          car.pos += maxMove;

          if (n === 4 &&
              car.pos > SPLIT_X + CAR_W &&
              car.pos < SPLIT_X + CAR_W + car.speed * 2 &&
              Math.random() < 0.4) {
            car.type  = 'offramp';
            car.pos   = 0;
            car.speed = 0.008 + Math.random() * 0.003;
            return;
          }

          if (car.pos > W + CAR_W) {
            const idx = cars.indexOf(car);
            if (idx !== -1) cars.splice(idx, 1);
          }
        });
      }

      const onrampCars = cars.filter(c => c.type === 'onramp')
                             .sort((a, b) => b.pos - a.pos);
      const rampOnLen  = Math.hypot(RAMP_ON_X1 - RAMP_ON_X0, RAMP_ON_Y1 - RAMP_ON_Y0);

      onrampCars.forEach((car, i) => {
        const leader = onrampCars[i - 1];
        let maxMove  = car.speed;

        if (leader) {
          const gapProg = (CAR_H + FOLLOW_GAP) / rampOnLen;
          const gap     = leader.pos - car.pos - gapProg;
          if (gap <= 0) return;
          maxMove = Math.min(maxMove, gap);
        }

        if (car.pos > 0.55) {
          const blocked = lanes[4].some(hc => Math.abs(hc.pos - MERGE_X) < MERGE_CLEAR);
          if (blocked) maxMove = 0;
        }

        car.pos += maxMove;

        if (car.pos >= 1.0) {
          car.type  = 'lane4';
          car.pos   = MERGE_X;
          car.speed = 1.7 + Math.random() * 0.6;
        }
      });

      const offrampCars = cars.filter(c => c.type === 'offramp')
                              .sort((a, b) => b.pos - a.pos);
      const rampOffLen  = Math.hypot(RAMP_OFF_X1 - RAMP_OFF_X0, RAMP_OFF_Y1 - RAMP_OFF_Y0);

      offrampCars.forEach((car, i) => {
        const leader = offrampCars[i - 1];
        let maxMove  = car.speed;
        if (leader) {
          const gapProg = (CAR_H + FOLLOW_GAP) / rampOffLen;
          const gap     = leader.pos - car.pos - gapProg;
          if (gap <= 0) return;
          maxMove = Math.min(maxMove, gap);
        }
        car.pos += maxMove;
        if (car.pos > 1.1) {
          const idx = cars.indexOf(car);
          if (idx !== -1) cars.splice(idx, 1);
        }
      });

      for (let n = 1; n <= 4; n++) trySpawnLane(n);

      const onrampMax   = 1 + Math.round((trafficVolume - 1) * (4 / 9));
      const onrampProb  = 0.001 + (trafficVolume - 1) * (0.014 / 9);
      const onrampCount = cars.filter(c => c.type === 'onramp').length;
      if (onrampCount < onrampMax && Math.random() < onrampProb) {
        const rearmost = onrampCars.length > 0
          ? Math.min(...onrampCars.map(c => c.pos))
          : 0;
        const newPos = Math.min(rearmost - 0.25, -0.1);
        cars.push(makeCar('onramp', newPos, 0.005 + Math.random() * 0.003));
      }
    }

    // ── Collision detection ───────────────────────────────────────────────────
    function isVisible(car) {
      if (car.type.startsWith('lane')) return car.pos + CAR_W >= 0 && car.pos <= W;
      return car.pos >= 0 && car.pos <= 1.0;
    }

    function checkCollisions() {
      const active = cars.filter(isVisible);
      for (let i = 0; i < active.length; i++) {
        for (let j = i + 1; j < active.length; j++) {
          if (boxesOverlap(getBBox(active[i]), getBBox(active[j]))) {
            crashPairs.push([active[i], active[j]]);
          }
        }
      }
      if (crashPairs.length > 0) {
        crashed    = true;
        hasCrashed = true;  // latch: stays true until Reset
        mode       = 'paused';   // pause on crash — controls remain active
        updateDvrUI();
      }
    }

    // ── Draw ──────────────────────────────────────────────────────────────────
    function drawRoads() {
      ctx.fillStyle = '#2d5a27';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#555';
      ctx.fillRect(0, HWY_TOP, W, HWY_H);

      ctx.strokeStyle = '#ddd';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(0, HWY_TOP); ctx.lineTo(W, HWY_TOP);
      ctx.moveTo(0, HWY_BOT); ctx.lineTo(W, HWY_BOT);
      ctx.stroke();

      ctx.setLineDash([24, 16]);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.5;
      for (let n = 1; n < NUM_LANES; n++) {
        const y = HWY_TOP + n * LANE_H;
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(W, y);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      ctx.fillStyle = 'rgba(255,255,255,0.11)';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      for (let n = 1; n <= NUM_LANES; n++) {
        for (let ax = 80; ax < W; ax += 160) {
          ctx.fillText('→', ax, laneCY(n) + 6);
        }
      }
      ctx.textAlign = 'left';

      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.font = '11px sans-serif';
      for (let n = 1; n <= NUM_LANES; n++) {
        ctx.fillText(`L${n}`, 6, laneCY(n) + 4);
      }

      ctx.fillStyle = '#4a4a4a';
      ctx.beginPath();
      ctx.moveTo(RAMP_ON_X0 - 14, RAMP_ON_Y0);
      ctx.lineTo(RAMP_ON_X0 + 14, RAMP_ON_Y0);
      ctx.lineTo(RAMP_ON_X1 + 12, RAMP_ON_Y1);
      ctx.lineTo(RAMP_ON_X1 - 12, RAMP_ON_Y1);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#4a4a4a';
      ctx.beginPath();
      ctx.moveTo(RAMP_OFF_X0 - 12, RAMP_OFF_Y0);
      ctx.lineTo(RAMP_OFF_X0 + 12, RAMP_OFF_Y0);
      ctx.lineTo(RAMP_OFF_X1 + 14, RAMP_OFF_Y1);
      ctx.lineTo(RAMP_OFF_X1 - 14, RAMP_OFF_Y1);
      ctx.closePath();
      ctx.fill();

      const l4top = HWY_TOP + 3 * LANE_H;
      const l4bot = HWY_BOT;

      ctx.fillStyle = 'rgba(255,200,0,0.10)';
      ctx.fillRect(MERGE_ZONE_X1, l4top, MERGE_ZONE_X2 - MERGE_ZONE_X1, LANE_H);

      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = 'rgba(0,220,255,0.7)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(MERGE_X - MERGE_CLEAR, l4top);
      ctx.lineTo(MERGE_X - MERGE_CLEAR, l4bot);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(MERGE_X + MERGE_CLEAR, l4top);
      ctx.lineTo(MERGE_X + MERGE_CLEAR, l4bot);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(0,220,255,0.75)';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('◄── MERGE_CLEAR ──►', MERGE_X, l4top - 4);
      ctx.textAlign = 'left';

      ctx.fillStyle = 'rgba(255,200,0,0.08)';
      ctx.fillRect(SPLIT_ZONE_X1, l4top, SPLIT_ZONE_X2 - SPLIT_ZONE_X1, LANE_H);

      ctx.fillStyle = '#bbb';
      ctx.font = '11px sans-serif';
      ctx.fillText('ON RAMP',  RAMP_ON_X0  - 14, RAMP_ON_Y0  + 16);
      ctx.fillText('OFF RAMP', RAMP_OFF_X1 - 58, RAMP_OFF_Y1 + 16);
    }

    function drawCar(car) {
      if (car.type.startsWith('lane')) {
        const n  = parseInt(car.type.slice(4));
        const cy = laneCY(n);
        drawCarRect(car.pos, cy - CAR_H / 2, CAR_W, CAR_H, car.color);
        return;
      }
      if (car.pos < 0 || car.pos > 1.05) return;
      const { x, y } = rampPos(car.pos, car.type);
      if (x < -CAR_H || x > W + CAR_H || y < 0 || y > H) return;
      const s = CAR_H;
      drawCarRect(x - s / 2, y - s / 2, s, s, car.color);
    }

    function drawCarRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#AED6F1';
      ctx.fillRect(x + w - 13, y + 3, 9, h - 6);
      ctx.fillStyle = '#111';
      ctx.fillRect(x + 4,      y + h - 3, 9, 5);
      ctx.fillRect(x + w - 13, y + h - 3, 9, 5);
    }

    function drawCrashOverlay() {
      // Only draw the crash overlay if we are at or near the crash frame
      // (playHead is at the end of history, or we are paused at crash)
      const atCrash = (playHead >= histLen - 2);
      if (!atCrash) return;

      crashPairs.forEach(([a, b]) => {
        [a, b].forEach(car => {
          // Find the car in the current cars array by id
          const live = cars.find(c => c.id === car.id);
          const target = live || car;
          const bb = getBBox(target);
          ctx.strokeStyle = '#FF4444';
          ctx.lineWidth = 3;
          ctx.setLineDash([]);
          ctx.strokeRect(bb.x - 5, bb.y - 5, bb.w + 10, bb.h + 10);
        });
      });

      const bw = 420, bh = 80;
      const bx = W / 2 - bw / 2, by = H / 2 - bh / 2;
      ctx.fillStyle = 'rgba(192,57,43,0.92)';
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 10);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('💥  CRASH  —  Use rewind to study the event', W / 2, by + 30);
      ctx.font = '13px sans-serif';
      ctx.fillStyle = '#fdd';
      ctx.fillText('Rewind to replay · Reset to start over', W / 2, by + 56);
      ctx.textAlign = 'left';
    }

    // ── DVR UI helpers ────────────────────────────────────────────────────────
    const btnPlay  = document.getElementById('btnPlay');
    const btnReset = document.getElementById('btnReset');
    const btnRew   = document.getElementById('btnRew');
    const btnFwd   = document.getElementById('btnFwd');
    const scrubBar = document.getElementById('scrubBar');
    const dvrLabel = document.getElementById('dvr-label');
    const statusEl = document.getElementById('status');

    function updateDvrUI() {
      // Scrub bar range = 0 to histLen-1
      scrubBar.max   = Math.max(0, histLen - 1);
      scrubBar.value = playHead;

      const pct = histLen > 1 ? Math.round((playHead / (histLen - 1)) * 100) : 100;
      const spd = speed();

      // Speed button always shows current speed
      btnSpeed.textContent = `Speed: ${spd}×`;
      btnSpeed.classList.toggle('active', spd > 1);

      if (mode === 'live') {
        btnPlay.textContent  = spd > 1 ? `⏸ Pause (▶ ${spd}×)` : '⏸ Pause';
        btnPlay.classList.remove('active');
        btnRew.classList.remove('active');
        dvrLabel.textContent = spd > 1 ? `Live ${spd}×` : 'Live';
        statusEl.textContent = spd > 1 ? `Running at ${spd}× speed…` : 'Running…';
        statusEl.style.color = '#aaa';
      } else if (mode === 'paused') {
        btnPlay.textContent = '▶ Play';
        btnPlay.classList.add('active');
        btnRew.classList.remove('active');
        if (crashed && playHead >= histLen - 2) {
          dvrLabel.textContent = 'CRASH';
          statusEl.textContent = '💥 Crash detected — rewind to study, or reset to restart.';
          statusEl.style.color = '#E74C3C';
        } else {
          dvrLabel.textContent = `Paused ${pct}%`;
          statusEl.textContent = `Paused at frame ${playHead} of ${histLen - 1}`;
          statusEl.style.color = '#f39c12';
        }
      } else if (mode === 'rewinding') {
        btnPlay.textContent = '▶ Play';
        btnPlay.classList.add('active');
        btnRew.classList.add('active');
        dvrLabel.textContent = `◀◀ ${pct}%`;
        statusEl.textContent = `Rewinding at ${spd}× — frame ${playHead} of ${histLen - 1}`;
        statusEl.style.color = '#3498DB';
      } else if (mode === 'replay') {
        btnPlay.textContent = '⏸ Pause';
        btnPlay.classList.remove('active');
        btnRew.classList.remove('active');
        dvrLabel.textContent = `▶ ${pct}%`;
        statusEl.textContent = `Replaying at ${spd}× — frame ${playHead} of ${histLen - 1}`;
        statusEl.style.color = '#2ECC71';
      }
    }

    // ── Button handlers ───────────────────────────────────────────────────────

    // Play/Pause
    btnPlay.addEventListener('click', () => {
      if (mode === 'live' || mode === 'replay') {
        mode = 'paused';
      } else if (mode === 'paused' || mode === 'rewinding') {
        restoreSnapshot(playHead);
        crashed           = false;
        crashPairs.length = 0;
        if (hasCrashed) {
          // A crash has occurred this session: replay frozen history, never generate new frames.
          mode = 'replay';
        } else {
          mode = 'live';
        }
      }
      updateDvrUI();
    });

    // Reset
    btnReset.addEventListener('click', () => {
      cars.length       = 0;
      history.length    = 0;
      histHead          = 0;
      histLen           = 0;
      playHead          = 0;
      crashed           = false;
      hasCrashed        = false;
      crashPairs.length = 0;
      spawnTimers       = { 1: 0, 2: 30, 3: 60, 4: 90 };
      speedIdx          = 0;
      mode              = 'live';
      seedInitialCars();
      updateDvrUI();
    });

    // Rewind: click to toggle on/off
    btnRew.addEventListener('click', () => {
      if (mode === 'rewinding') {
        mode = 'paused'; // stop rewinding, stay at current frame
      } else {
        mode = 'rewinding'; // start rewinding from current position
      }
      updateDvrUI();
    });

    // Speed: cycle 1× → 2× → 4× → 1×
    const btnSpeed = document.getElementById('btnSpeed');
    btnSpeed.addEventListener('click', () => {
      speedIdx = (speedIdx + 1) % SPEEDS.length;
      updateDvrUI();
    });

    // Scrub bar: drag to jump to any recorded frame
    // On mousedown/touchstart, freeze the max so it doesn't shift while dragging.
    let scrubMax = 0;
    scrubBar.addEventListener('mousedown',  () => { scrubMax = histLen - 1; scrubBar.max = scrubMax; });
    scrubBar.addEventListener('touchstart', () => { scrubMax = histLen - 1; scrubBar.max = scrubMax; });
    scrubBar.addEventListener('input', () => {
      const v = Math.min(parseInt(scrubBar.value, 10), histLen - 1);
      playHead = v;
      mode     = 'paused';
      restoreSnapshot(playHead);
      // Clear crash state so the overlay doesn't show on pre-crash frames.
      // If user scrubs to the crash frame, the overlay will re-appear via drawCrashOverlay.
      if (playHead < histLen - 2) {
        crashed           = false;
        crashPairs.length = 0;
      }
      updateDvrUI();
    });
    // When the user releases the scrub bar, re-sync max to current histLen.
    scrubBar.addEventListener('mouseup',  () => { scrubBar.max = Math.max(0, histLen - 1); updateDvrUI(); });
    scrubBar.addEventListener('touchend', () => { scrubBar.max = Math.max(0, histLen - 1); updateDvrUI(); });

    // ── Main loop ─────────────────────────────────────────────────────────────
    function update() {
      if (mode === 'live') {
        // Run updateCars() speed() times per frame for the speed multiplier.
        // Each logical tick is recorded in history.
        const ticks = speed();
        for (let t = 0; t < ticks; t++) {
          pushHistory(snapshot());
          updateCars();
          checkCollisions();
          if (crashed) break; // stop ticking once a crash is detected
        }
        updateDvrUI();
      } else if (mode === 'rewinding') {
        // Step backward through history at speed() frames per render frame
        const step = speed();
        playHead = Math.max(0, playHead - step);
        restoreSnapshot(playHead);
        // Clear crash overlay once we've rewound past the crash frame
        if (crashed && playHead < histLen - 2) {
          crashed           = false;
          crashPairs.length = 0;
        }
        if (playHead === 0) mode = 'paused'; // stop at beginning
        updateDvrUI();
      } else if (mode === 'replay') {
        // After a crash: step forward through frozen history — never generate new frames.
        const step = speed();
        playHead = Math.min(histLen - 1, playHead + step);
        restoreSnapshot(playHead);
        // Re-show crash overlay when we reach the crash frame
        if (playHead >= histLen - 2) {
          crashed = true;
          mode    = 'paused';
        }
        updateDvrUI();
      }
      // mode === 'paused': nothing to update
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      drawRoads();
      cars.forEach(drawCar);
      if (crashed) drawCrashOverlay();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    initLayout();
    seedInitialCars();
    loop();
  })();
  </script>
</body>
</html>
