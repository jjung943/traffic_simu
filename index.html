<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Simulation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      font-family: sans-serif;
      color: #eee;
      overflow: hidden;
    }
    #header {
      text-align: center;
      padding: 10px 0 6px;
    }
    #header h1 { font-size: 1.2rem; letter-spacing: 0.05em; }
    #header p  { font-size: 0.78rem; color: #aaa; margin-top: 2px; }
    #controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 6px;
      font-size: 0.82rem;
      color: #ccc;
    }
    #controls label { white-space: nowrap; }
    #volumeSlider {
      -webkit-appearance: none;
      width: 180px;
      height: 5px;
      border-radius: 3px;
      background: #444;
      outline: none;
      cursor: pointer;
    }
    #volumeSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #3498DB;
      cursor: pointer;
    }
    #volumeVal {
      min-width: 28px;
      text-align: left;
      color: #3498DB;
      font-weight: bold;
    }
    canvas {
      display: block;
      width: 100%;
    }
    #status {
      text-align: center;
      padding: 6px 0;
      font-size: 0.82rem;
      color: #aaa;
      min-height: 1.4em;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>Traffic Simulation — 4-Lane Highway</h1>
    <p>One-way (→) · 4 lanes · On/off ramp (lane 4) · Collision detection · No stopping in merge zone</p>
    <div id="controls">
      <label for="volumeSlider">Traffic Volume:</label>
      <input type="range" id="volumeSlider" min="1" max="10" value="5" step="1" />
      <span id="volumeVal">5</span>
      <span style="color:#666">| 1 = sparse &nbsp; 10 = overloaded</span>
    </div>
  </div>
  <canvas id="sim"></canvas>
  <div id="status">Running…</div>

  <script>
  (() => {
    // ── Canvas ────────────────────────────────────────────────────────────────
    const canvas  = document.getElementById('sim');
    const ctx     = canvas.getContext('2d');
    const HEADER_H = document.getElementById('header').offsetHeight;
    const STATUS_H = 28;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight - HEADER_H - STATUS_H;
    }
    resize();
    window.addEventListener('resize', () => { resize(); initLayout(); });

    // ── Layout ────────────────────────────────────────────────────────────────
    const NUM_LANES = 4;
    const LANE_H    = 38;
    const HWY_H     = NUM_LANES * LANE_H;
    const RAMP_DROP = 100;

    let W, H, HWY_TOP, HWY_BOT;
    let MERGE_X, SPLIT_X;
    let RAMP_ON_X0, RAMP_ON_Y0, RAMP_ON_X1, RAMP_ON_Y1;
    let RAMP_OFF_X0, RAMP_OFF_Y0, RAMP_OFF_X1, RAMP_OFF_Y1;
    let MERGE_ZONE_X1, MERGE_ZONE_X2, SPLIT_ZONE_X1, SPLIT_ZONE_X2;
    let MERGE_CLEAR;

    function initLayout() {
      W       = canvas.width;
      H       = canvas.height;
      HWY_TOP = Math.round((H - HWY_H - RAMP_DROP) / 2);
      HWY_BOT = HWY_TOP + HWY_H;

      MERGE_X = Math.round(W * 0.25);
      SPLIT_X = Math.round(W * 0.75);

      RAMP_ON_X0  = MERGE_X - RAMP_DROP;
      RAMP_ON_Y0  = HWY_BOT + RAMP_DROP;
      RAMP_ON_X1  = MERGE_X;
      RAMP_ON_Y1  = laneCY(4);

      RAMP_OFF_X0 = SPLIT_X;
      RAMP_OFF_Y0 = laneCY(4);
      RAMP_OFF_X1 = SPLIT_X + RAMP_DROP;
      RAMP_OFF_Y1 = HWY_BOT + RAMP_DROP;

      MERGE_ZONE_X1 = MERGE_X - 60;
      MERGE_ZONE_X2 = MERGE_X + 60;
      SPLIT_ZONE_X1 = SPLIT_X - 60;
      SPLIT_ZONE_X2 = SPLIT_X + 60;

      // Distance from merge/split point that must be clear before a ramp car
      // commits to entering or a lane 4 car peels off.
      MERGE_CLEAR = CAR_W + 120;
    }

    function laneCY(n) { return HWY_TOP + (n - 1) * LANE_H + LANE_H / 2; }

    // ── Car dimensions ────────────────────────────────────────────────────────
    const CAR_W      = 42;
    const CAR_H      = 22;
    const FOLLOW_GAP = 12;

    // ── State ─────────────────────────────────────────────────────────────────
    let crashed    = false;
    let crashPairs = [];
    let nextId     = 0;

    // ── Helpers ───────────────────────────────────────────────────────────────
    const COLORS = ['#E74C3C','#E67E22','#9B59B6','#3498DB','#1ABC9C',
                    '#F39C12','#2ECC71','#E91E63','#00BCD4','#CDDC39','#FF5722'];
    function rndColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

    function makeCar(type, pos, speed, color) {
      return { id: nextId++, type, pos, speed, color: color || rndColor() };
    }

    function rampPos(progress, type) {
      if (type === 'onramp') {
        return {
          x: RAMP_ON_X0  + (RAMP_ON_X1  - RAMP_ON_X0)  * progress,
          y: RAMP_ON_Y0  + (RAMP_ON_Y1  - RAMP_ON_Y0)  * progress,
        };
      }
      return {
        x: RAMP_OFF_X0 + (RAMP_OFF_X1 - RAMP_OFF_X0) * progress,
        y: RAMP_OFF_Y0 + (RAMP_OFF_Y1 - RAMP_OFF_Y0) * progress,
      };
    }

    // ── Car array ─────────────────────────────────────────────────────────────
    // Cars are created dynamically; no fixed initial set.
    // Spawning is handled by the spawn system below.
    const cars = [];

    // ── Traffic volume slider ─────────────────────────────────────────────────
    // Volume 1–10 maps to spawn interval and max cars per lane.
    // Higher volume = shorter interval + more cars allowed on screen.
    const sliderEl  = document.getElementById('volumeSlider');
    const volumeVal = document.getElementById('volumeVal');
    let trafficVolume = parseInt(sliderEl.value, 10);

    sliderEl.addEventListener('input', () => {
      trafficVolume = parseInt(sliderEl.value, 10);
      volumeVal.textContent = trafficVolume;
    });

    // Volume → spawn interval (frames). Vol 1 = ~300 frames, Vol 10 = ~30 frames.
    function spawnInterval() {
      const base = Math.round(300 - (trafficVolume - 1) * (270 / 9));
      return base + Math.floor(Math.random() * 30);
    }

    // Volume → max lane cars allowed on canvas at once.
    // Vol 1 = 2 cars/lane, Vol 10 = 12 cars/lane.
    function maxCarsPerLane() {
      return 2 + Math.round((trafficVolume - 1) * (10 / 9));
    }

    // ── Spawn system ──────────────────────────────────────────────────────────
    const spawnTimers = { 1: 0, 2: 30, 3: 60, 4: 90 }; // staggered initial delays

    function trySpawnLane(n) {
      spawnTimers[n]--;
      if (spawnTimers[n] > 0) return;

      const laneCars = cars.filter(c => c.type === `lane${n}`);

      // Respect max density cap
      if (laneCars.length >= maxCarsPerLane()) {
        spawnTimers[n] = spawnInterval();
        return;
      }

      // Check that the entry zone is clear
      const blocked = laneCars.some(c => c.pos < CAR_W + FOLLOW_GAP * 3);
      if (!blocked) {
        const speed = 1.8 + Math.random() * 0.7;
        cars.push(makeCar(`lane${n}`, -CAR_W, speed));
      }
      spawnTimers[n] = spawnInterval();
    }

    // Seed a few cars immediately so the highway isn't empty at start
    function seedInitialCars() {
      const offsets = [100, 320, 580, 860, 1150];
      for (let n = 1; n <= 4; n++) {
        offsets.forEach(off => {
          const speed = 1.8 + Math.random() * 0.7;
          cars.push(makeCar(`lane${n}`, -off, speed));
        });
      }
      // Two on-ramp cars queued up
      cars.push(makeCar('onramp', -0.30, 0.006));
      cars.push(makeCar('onramp', -0.75, 0.007));
    }

    // ── Bounding boxes ────────────────────────────────────────────────────────
    function getBBox(car) {
      const PAD = 1;
      if (car.type.startsWith('lane')) {
        const n  = parseInt(car.type.slice(4));
        const cy = laneCY(n);
        return { x: car.pos + PAD, y: cy - CAR_H / 2 + PAD,
                 w: CAR_W - PAD * 2, h: CAR_H - PAD * 2 };
      }
      const { x, y } = rampPos(car.pos, car.type);
      const S = CAR_H / 2 - PAD;
      return { x: x - S, y: y - S, w: S * 2, h: S * 2 };
    }

    function boxesOverlap(a, b) {
      return !(a.x + a.w <= b.x || b.x + b.w <= a.x ||
               a.y + a.h <= b.y || b.y + b.h <= a.y);
    }

    // ── Update ────────────────────────────────────────────────────────────────
    function updateCars() {
      // Build sorted lane arrays (furthest right = index 0 = leader)
      const lanes = {};
      for (let n = 1; n <= 4; n++) {
        lanes[n] = cars.filter(c => c.type === `lane${n}`)
                       .sort((a, b) => b.pos - a.pos);
      }

      // ── Highway lanes ──
      for (let n = 1; n <= 4; n++) {
        lanes[n].forEach((car, i) => {
          const leader   = lanes[n][i - 1];
          let maxMove    = car.speed;

          // Leader-following: maintain FOLLOW_GAP behind the car ahead
          if (leader) {
            const gap = leader.pos - (car.pos + CAR_W) - FOLLOW_GAP;
            maxMove = Math.min(maxMove, Math.max(0, gap));
          }

          // No stopping in merge/split zone (lane 4)
          // IMPORTANT: only raise the floor if there is no leader immediately ahead.
          // Never override the leader-following gap — that would cause rear-ends.
          if (n === 4) {
            const inZone = (car.pos + CAR_W > MERGE_ZONE_X1 && car.pos < MERGE_ZONE_X2) ||
                           (car.pos + CAR_W > SPLIT_ZONE_X1 && car.pos < SPLIT_ZONE_X2);
            if (inZone && !leader) maxMove = Math.max(maxMove, 1);
          }

          // Ramp-awareness (lane 4 only): if a committed on-ramp car (progress > 0.75)
          // is approaching, slow down approaching lane 4 cars to open a gap.
          // Only applies to cars that haven't yet passed MERGE_X.
          if (n === 4 && car.pos + CAR_W < MERGE_X) {
            const hasCommitted = cars.some(
              c => c.type === 'onramp' && c.pos > 0.75
            );
            if (hasCommitted) {
              // Slow to half speed to open a gap ahead of the merge point
              maxMove = Math.min(maxMove, car.speed * 0.5);
            }
          }

          car.pos += maxMove;

          // ── Off-ramp peel-off (lane 4 only) ──
          // A car may peel off only when it has fully cleared SPLIT_X
          // (its back edge is past the split point) so there is no
          // overlap with the lane 4 car behind it at the moment of
          // type conversion. The 40% chance fires once per crossing.
          if (n === 4 &&
              car.pos > SPLIT_X + CAR_W &&          // back edge past split
              car.pos < SPLIT_X + CAR_W + car.speed * 2 && // only in the crossing window
              Math.random() < 0.4) {
            car.type         = 'offramp';
            car.pos          = 0;
            car.speed        = 0.008 + Math.random() * 0.003;
            car.mergingFrames = 30; // grace period: skip collision checks during peel-off
            return; // skip removal check this frame
          }

          // Remove cars that have left the right edge — no wrap-around
          if (car.pos > W + CAR_W) {
            const idx = cars.indexOf(car);
            if (idx !== -1) cars.splice(idx, 1);
          }
        });
      }

      // ── On-ramp: leader-following + gap acceptance ──
      const onrampCars = cars.filter(c => c.type === 'onramp')
                             .sort((a, b) => b.pos - a.pos);
      const rampOnLen  = Math.hypot(RAMP_ON_X1 - RAMP_ON_X0, RAMP_ON_Y1 - RAMP_ON_Y0);

      onrampCars.forEach((car, i) => {
        const leader = onrampCars[i - 1];
        let maxMove  = car.speed;

        // Leader-following on ramp
        if (leader) {
          const gapProg = (CAR_H + FOLLOW_GAP) / rampOnLen;
          const gap     = leader.pos - car.pos - gapProg;
          if (gap <= 0) return;
          maxMove = Math.min(maxMove, gap);
        }

        // ── Two-phase merge commitment ──
        // YIELD ZONE (0.60 – 0.75): car may slow to a crawl while waiting for a gap.
        //   It never fully stops — minimum 15% speed so it keeps creeping forward.
        // COMMITTED (> 0.75): car has passed the point of no return.
        //   It ignores the gap check and always moves at least 0.5px/frame.
        //   The lane 4 no-stopping-in-merge-zone rule ensures space is made.
        if (car.pos > 0.60 && car.pos <= 0.75) {
          const blocked = lanes[4].some(hc => Math.abs(hc.pos - MERGE_X) < MERGE_CLEAR);
          if (blocked) {
            maxMove = Math.max(car.speed * 0.15, 0.5 / rampOnLen);
          }
        } else if (car.pos > 0.75) {
          // Committed — enforce minimum forward progress regardless of anything
          maxMove = Math.max(maxMove, 0.5 / rampOnLen);
        }

        car.pos += maxMove;

        // Merge: insert behind the rearmost lane 4 car that has already
        // passed MERGE_X, or just ahead of MERGE_X if the lane is clear.
        // This guarantees the new car never spawns on top of an existing one.
        if (car.pos >= 1.0) {
          const lane4Ahead = cars
            .filter(c => c.type === 'lane4' && c.pos >= MERGE_X)
            .sort((a, b) => a.pos - b.pos); // sort ascending — rearmost first
          let insertPos;
          if (lane4Ahead.length > 0) {
            const rearmost = lane4Ahead[0];
            insertPos = rearmost.pos - CAR_W - FOLLOW_GAP * 2;
          } else {
            insertPos = MERGE_X + FOLLOW_GAP;
          }
          // Safety: never insert behind MERGE_X (would be off-ramp side)
          insertPos = Math.max(insertPos, MERGE_X + FOLLOW_GAP);
          car.type         = 'lane4';
          car.pos          = insertPos;
          car.speed        = 1.7 + Math.random() * 0.6;
          car.mergingFrames = 30; // grace period: skip collision checks for 30 frames
          // color preserved
        }
      });

      // ── Off-ramp: leader-following ──
      const offrampCars = cars.filter(c => c.type === 'offramp')
                              .sort((a, b) => b.pos - a.pos);
      const rampOffLen  = Math.hypot(RAMP_OFF_X1 - RAMP_OFF_X0, RAMP_OFF_Y1 - RAMP_OFF_Y0);

      offrampCars.forEach((car, i) => {
        const leader = offrampCars[i - 1];
        let maxMove  = car.speed;

        if (leader) {
          const gapProg = (CAR_H + FOLLOW_GAP) / rampOffLen;
          const gap     = leader.pos - car.pos - gapProg;
          if (gap <= 0) return;
          maxMove = Math.min(maxMove, gap);
        }

        car.pos += maxMove;

        // Car exits the bottom of the off-ramp — remove it permanently
        if (car.pos > 1.1) {
          const idx = cars.indexOf(car);
          if (idx !== -1) cars.splice(idx, 1);
        }
      });

      // ── Tick down merge grace periods ──
      cars.forEach(c => { if (c.mergingFrames > 0) c.mergingFrames--; });

      // ── Spawn new cars ──
      for (let n = 1; n <= 4; n++) trySpawnLane(n);

      // ── Occasionally spawn a new on-ramp car if ramp is empty or sparse ──
      // Probability scales with volume: Vol 1 = 0.001/frame, Vol 10 = 0.015/frame
      const onrampMax   = 1 + Math.round((trafficVolume - 1) * (4 / 9)); // 1–5 ramp cars
      const onrampProb  = 0.001 + (trafficVolume - 1) * (0.014 / 9);
      const onrampCount = cars.filter(c => c.type === 'onramp').length;
      if (onrampCount < onrampMax && Math.random() < onrampProb) {
        // Find the rearmost on-ramp car to queue behind
        const rearmost = onrampCars.length > 0
          ? Math.min(...onrampCars.map(c => c.pos))
          : 0;
        const newPos = Math.min(rearmost - 0.25, -0.1);
        cars.push(makeCar('onramp', newPos, 0.005 + Math.random() * 0.003));
      }
    }

     // ── Collision detection ─────────────────────────────────────────────────
    // Rules:
    //  • Highway cars (lane1–4) only collide with other highway cars.
    //  • Ramp cars (onramp/offramp) only collide with other ramp cars.
    //  • Cars in a merge grace period are excluded entirely.
    // This prevents false positives at the merge/split point where a ramp
    // car and a lane car briefly share the same pixel during the transition.
    function checkCollisions() {
      const highwayCars = cars.filter(c =>
        !c.mergingFrames &&
        c.type.startsWith('lane') &&
        c.pos + CAR_W >= 0 && c.pos <= W
      );
      const rampCars = cars.filter(c =>
        !c.mergingFrames &&
        (c.type === 'onramp' || c.type === 'offramp') &&
        c.pos >= 0 && c.pos <= 1.0
      );

      // Check highway cars against each other
      for (let i = 0; i < highwayCars.length; i++) {
        for (let j = i + 1; j < highwayCars.length; j++) {
          if (boxesOverlap(getBBox(highwayCars[i]), getBBox(highwayCars[j]))) {
            crashPairs.push([highwayCars[i], highwayCars[j]]);
          }
        }
      }
      // Check ramp cars against each other
      for (let i = 0; i < rampCars.length; i++) {
        for (let j = i + 1; j < rampCars.length; j++) {
          if (boxesOverlap(getBBox(rampCars[i]), getBBox(rampCars[j]))) {
            crashPairs.push([rampCars[i], rampCars[j]]);
          }
        }
      }
      if (crashPairs.length > 0) crashed = true;
    }

    // ── Draw ──────────────────────────────────────────────────────────────────
    function drawRoads() {
      // Grass
      ctx.fillStyle = '#2d5a27';
      ctx.fillRect(0, 0, W, H);

      // Highway surface
      ctx.fillStyle = '#555';
      ctx.fillRect(0, HWY_TOP, W, HWY_H);

      // Outer edge lines
      ctx.strokeStyle = '#ddd';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(0, HWY_TOP); ctx.lineTo(W, HWY_TOP);
      ctx.moveTo(0, HWY_BOT); ctx.lineTo(W, HWY_BOT);
      ctx.stroke();

      // Inner lane dividers
      ctx.setLineDash([24, 16]);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.5;
      for (let n = 1; n < NUM_LANES; n++) {
        const y = HWY_TOP + n * LANE_H;
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(W, y);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // Direction arrows
      ctx.fillStyle = 'rgba(255,255,255,0.11)';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      for (let n = 1; n <= NUM_LANES; n++) {
        for (let ax = 80; ax < W; ax += 160) {
          ctx.fillText('→', ax, laneCY(n) + 6);
        }
      }
      ctx.textAlign = 'left';

      // Lane labels
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.font = '11px sans-serif';
      for (let n = 1; n <= NUM_LANES; n++) {
        ctx.fillText(`L${n}`, 6, laneCY(n) + 4);
      }

      // On-ramp surface
      ctx.fillStyle = '#4a4a4a';
      ctx.beginPath();
      ctx.moveTo(RAMP_ON_X0 - 14, RAMP_ON_Y0);
      ctx.lineTo(RAMP_ON_X0 + 14, RAMP_ON_Y0);
      ctx.lineTo(RAMP_ON_X1 + 12, RAMP_ON_Y1);
      ctx.lineTo(RAMP_ON_X1 - 12, RAMP_ON_Y1);
      ctx.closePath();
      ctx.fill();

      // Off-ramp surface
      ctx.fillStyle = '#4a4a4a';
      ctx.beginPath();
      ctx.moveTo(RAMP_OFF_X0 - 12, RAMP_OFF_Y0);
      ctx.lineTo(RAMP_OFF_X0 + 12, RAMP_OFF_Y0);
      ctx.lineTo(RAMP_OFF_X1 + 14, RAMP_OFF_Y1);
      ctx.lineTo(RAMP_OFF_X1 - 14, RAMP_OFF_Y1);
      ctx.closePath();
      ctx.fill();

      // ── MERGE_CLEAR boundary visualisation ──
      // Two vertical dashed lines on lane 4 showing the zone that must be
      // clear before an on-ramp car is allowed to merge.
      const l4top = HWY_TOP + 3 * LANE_H;
      const l4bot = HWY_BOT;

      // Merge zone fill (yellow tint)
      ctx.fillStyle = 'rgba(255,200,0,0.10)';
      ctx.fillRect(MERGE_ZONE_X1, l4top, MERGE_ZONE_X2 - MERGE_ZONE_X1, LANE_H);

      // MERGE_CLEAR boundary lines (cyan, dashed)
      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = 'rgba(0,220,255,0.7)';
      ctx.lineWidth = 1.5;
      // Left boundary: MERGE_X - MERGE_CLEAR
      ctx.beginPath();
      ctx.moveTo(MERGE_X - MERGE_CLEAR, l4top);
      ctx.lineTo(MERGE_X - MERGE_CLEAR, l4bot);
      ctx.stroke();
      // Right boundary: MERGE_X + MERGE_CLEAR
      ctx.beginPath();
      ctx.moveTo(MERGE_X + MERGE_CLEAR, l4top);
      ctx.lineTo(MERGE_X + MERGE_CLEAR, l4bot);
      ctx.stroke();
      // Label
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(0,220,255,0.75)';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('◄── MERGE_CLEAR ──►', MERGE_X, l4top - 4);
      ctx.textAlign = 'left';

      // Split zone fill
      ctx.fillStyle = 'rgba(255,200,0,0.08)';
      ctx.fillRect(SPLIT_ZONE_X1, l4top, SPLIT_ZONE_X2 - SPLIT_ZONE_X1, LANE_H);

      // Ramp labels
      ctx.fillStyle = '#bbb';
      ctx.font = '11px sans-serif';
      ctx.fillText('ON RAMP',  RAMP_ON_X0  - 14, RAMP_ON_Y0  + 16);
      ctx.fillText('OFF RAMP', RAMP_OFF_X1 - 58, RAMP_OFF_Y1 + 16);
    }

    function drawCar(car) {
      if (car.type.startsWith('lane')) {
        const n  = parseInt(car.type.slice(4));
        const cy = laneCY(n);
        drawCarRect(car.pos, cy - CAR_H / 2, CAR_W, CAR_H, car.color);
        return;
      }
      if (car.pos < 0 || car.pos > 1.05) return;
      const { x, y } = rampPos(car.pos, car.type);
      if (x < -CAR_H || x > W + CAR_H || y < 0 || y > H) return;
      const s = CAR_H;
      drawCarRect(x - s / 2, y - s / 2, s, s, car.color);
    }

    function drawCarRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#AED6F1';
      ctx.fillRect(x + w - 13, y + 3, 9, h - 6);
      ctx.fillStyle = '#111';
      ctx.fillRect(x + 4,      y + h - 3, 9, 5);
      ctx.fillRect(x + w - 13, y + h - 3, 9, 5);
    }

    function drawCrash() {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);

      crashPairs.forEach(([a, b]) => {
        [a, b].forEach(car => {
          const bb = getBBox(car);
          ctx.strokeStyle = '#FF4444';
          ctx.lineWidth = 3;
          ctx.setLineDash([]);
          ctx.strokeRect(bb.x - 5, bb.y - 5, bb.w + 10, bb.h + 10);
        });
      });

      const bw = 400, bh = 90;
      const bx = W / 2 - bw / 2, by = H / 2 - bh / 2;
      ctx.fillStyle = '#C0392B';
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 12);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('💥  CRASH — Simulation Stopped', W / 2, by + 34);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = '#fdd';
      ctx.fillText('Two cars made contact. Reload the page to restart.', W / 2, by + 62);
      ctx.textAlign = 'left';

      document.getElementById('status').innerHTML = '⚠️ Crash detected — simulation halted.';
      document.getElementById('status').style.color = '#E74C3C';
    }

    // ── Main loop ─────────────────────────────────────────────────────────────
    function update() {
      if (crashed) return;
      updateCars();
      checkCollisions();
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      drawRoads();
      cars.forEach(drawCar);
      if (crashed) drawCrash();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    initLayout();
    seedInitialCars();
    loop();
  })();
  </script>
</body>
</html>
