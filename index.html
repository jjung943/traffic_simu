<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Simulation</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      color: #eee;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 1.4rem;
      letter-spacing: 0.05em;
    }
    p.subtitle {
      margin: 0 0 16px;
      font-size: 0.85rem;
      color: #aaa;
    }
    canvas {
      border: 2px solid #444;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Traffic Simulation — Phase 3</h1>
  <p class="subtitle">Multiple cars · Intersection · Traffic lights · Stop/go behavior</p>
  <canvas id="sim" width="800" height="500"></canvas>

  <script>
    // ─── Canvas ───────────────────────────────────────────────────────────────
    const canvas = document.getElementById("sim");
    const ctx    = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    // ─── Layout constants ────────────────────────────────────────────────────
    const ROAD_W   = 60;   // width of each road (two lanes, 30px each)
    const LANE_W   = ROAD_W / 2;

    // Horizontal road: centred vertically
    const H_ROAD_Y = H / 2 - ROAD_W / 2;   // top edge of horizontal road

    // Vertical road: centred horizontally
    const V_ROAD_X = W / 2 - ROAD_W / 2;   // left edge of vertical road

    // Intersection box
    const IX = V_ROAD_X;
    const IY = H_ROAD_Y;
    const IW = ROAD_W;
    const IH = ROAD_W;

    // Stop lines (cars stop just before the intersection)
    const STOP_MARGIN = 4;
    const H_STOP_LEFT  = IX - STOP_MARGIN;           // cars going right stop here
    const H_STOP_RIGHT = IX + IW + STOP_MARGIN;      // cars going left stop here
    const V_STOP_TOP   = IY - STOP_MARGIN;           // cars going down stop here
    const V_STOP_BOT   = IY + IH + STOP_MARGIN;      // cars going up stop here

    // ─── Car dimensions ──────────────────────────────────────────────────────
    const CAR_W = 36;
    const CAR_H = 18;
    const FOLLOW_GAP = 10;   // minimum gap between front of following car and rear of leader

    // ─── Traffic light ───────────────────────────────────────────────────────
    // PHASE_H: horizontal road has green  (vertical has red)
    // PHASE_V: vertical road has green    (horizontal has red)
    const LIGHT_DURATION = 180; // frames per phase (~3 s at 60 fps)
    const YELLOW_DURATION = 40;

    let lightTimer = 0;
    // States: 'H_GREEN', 'H_YELLOW', 'V_GREEN', 'V_YELLOW'
    let lightState = 'H_GREEN';

    function isHorizontalGreen() {
      return lightState === 'H_GREEN' || lightState === 'H_YELLOW';
    }
    function isVerticalGreen() {
      return lightState === 'V_GREEN' || lightState === 'V_YELLOW';
    }
    function hColor() {
      if (lightState === 'H_GREEN')  return '#2ECC71';
      if (lightState === 'H_YELLOW') return '#F1C40F';
      return '#E74C3C';
    }
    function vColor() {
      if (lightState === 'V_GREEN')  return '#2ECC71';
      if (lightState === 'V_YELLOW') return '#F1C40F';
      return '#E74C3C';
    }

    function updateLight() {
      lightTimer++;
      if (lightState === 'H_GREEN'  && lightTimer >= LIGHT_DURATION)  { lightState = 'H_YELLOW'; lightTimer = 0; }
      else if (lightState === 'H_YELLOW' && lightTimer >= YELLOW_DURATION) { lightState = 'V_GREEN';  lightTimer = 0; }
      else if (lightState === 'V_GREEN'  && lightTimer >= LIGHT_DURATION)  { lightState = 'V_YELLOW'; lightTimer = 0; }
      else if (lightState === 'V_YELLOW' && lightTimer >= YELLOW_DURATION) { lightState = 'H_GREEN';  lightTimer = 0; }
    }

    // ─── Car factory ─────────────────────────────────────────────────────────
    // direction: 'right' | 'left' | 'down' | 'up'
    // pos: position along the travel axis (x for horizontal, y for vertical)
    function makeCar(direction, pos, speed, color) {
      return { direction, pos, speed, color, stopped: false };
    }

    // Horizontal road:
    //   Lane 1 (top lane)    → cars travel RIGHT, lane centre at H_ROAD_Y + LANE_W/2
    //   Lane 2 (bottom lane) → cars travel LEFT,  lane centre at H_ROAD_Y + LANE_W + LANE_W/2
    const LANE_RIGHT_Y = H_ROAD_Y + LANE_W / 2 - CAR_H / 2;
    const LANE_LEFT_Y  = H_ROAD_Y + LANE_W + LANE_W / 2 - CAR_H / 2;

    // Vertical road:
    //   Lane 1 (left lane)   → cars travel DOWN,  lane centre at V_ROAD_X + LANE_W/2
    //   Lane 2 (right lane)  → cars travel UP,    lane centre at V_ROAD_X + LANE_W + LANE_W/2
    const LANE_DOWN_X = V_ROAD_X + LANE_W / 2 - CAR_H / 2;
    const LANE_UP_X   = V_ROAD_X + LANE_W + LANE_W / 2 - CAR_H / 2;

    // Spawn cars spread across the canvas
    const cars = [
      // Going right
      makeCar('right', -200,  2.0, '#E74C3C'),
      makeCar('right', -500,  1.6, '#E67E22'),
      makeCar('right', -750,  1.8, '#9B59B6'),
      // Going left
      makeCar('left',  W+100, 1.8, '#3498DB'),
      makeCar('left',  W+400, 2.2, '#1ABC9C'),
      makeCar('left',  W+650, 1.5, '#F39C12'),
      // Going down
      makeCar('down',  -150,  1.7, '#2ECC71'),
      makeCar('down',  -400,  2.0, '#E74C3C'),
      // Going up
      makeCar('up',    H+100, 1.9, '#F1C40F'),
      makeCar('up',    H+380, 1.6, '#E91E63'),
    ];

    // ─── Car update ──────────────────────────────────────────────────────────
    function carFront(car) {
      // Returns the leading edge of the car in its travel direction
      if (car.direction === 'right') return car.pos + CAR_W;
      if (car.direction === 'left')  return car.pos;            // front is the left edge
      if (car.direction === 'down')  return car.pos + CAR_W;   // CAR_W used as length along travel
      if (car.direction === 'up')    return car.pos;
    }

    function carRear(car) {
      if (car.direction === 'right') return car.pos;
      if (car.direction === 'left')  return car.pos + CAR_W;
      if (car.direction === 'down')  return car.pos;
      if (car.direction === 'up')    return car.pos + CAR_W;
    }

    function updateCars() {
      // Sort cars by lane/direction for leader-finding
      const rightCars = cars.filter(c => c.direction === 'right').sort((a,b) => b.pos - a.pos);
      const leftCars  = cars.filter(c => c.direction === 'left' ).sort((a,b) => a.pos - b.pos);
      const downCars  = cars.filter(c => c.direction === 'down' ).sort((a,b) => b.pos - a.pos);
      const upCars    = cars.filter(c => c.direction === 'up'   ).sort((a,b) => a.pos - b.pos);

      function processLane(lane, stopLine, greenCheck, wrap, wrapTo) {
        lane.forEach((car, i) => {
          const leader = lane[i - 1]; // car ahead in sorted order

          // Distance to stop line
          let distToStop = Infinity;
          if (!greenCheck()) {
            if (car.direction === 'right' || car.direction === 'down') {
              distToStop = stopLine - carFront(car);
            } else {
              distToStop = carFront(car) - stopLine;
            }
          }

          // Distance to leader
          let distToLeader = Infinity;
          if (leader) {
            if (car.direction === 'right' || car.direction === 'down') {
              distToLeader = carRear(leader) - carFront(car) - FOLLOW_GAP;
            } else {
              distToLeader = carFront(car) - carRear(leader) - FOLLOW_GAP;
            }
          }

          const gap = Math.min(distToStop, distToLeader);

          if (gap <= 0) {
            car.stopped = true;
          } else {
            car.stopped = false;
            const move = Math.min(car.speed, gap);
            if (car.direction === 'right' || car.direction === 'down') {
              car.pos += move;
            } else {
              car.pos -= move;
            }
          }

          // Wrap around when fully off screen
          if (car.direction === 'right' && car.pos > W + CAR_W)  car.pos = wrapTo;
          if (car.direction === 'left'  && car.pos < -CAR_W * 2) car.pos = wrapTo;
          if (car.direction === 'down'  && car.pos > H + CAR_W)  car.pos = wrapTo;
          if (car.direction === 'up'    && car.pos < -CAR_W * 2) car.pos = wrapTo;
        });
      }

      processLane(rightCars, H_STOP_LEFT,  isHorizontalGreen, true, -CAR_W - 10);
      processLane(leftCars,  H_STOP_RIGHT, isHorizontalGreen, true, W + CAR_W + 10);
      processLane(downCars,  V_STOP_TOP,   isVerticalGreen,   true, -CAR_W - 10);
      processLane(upCars,    V_STOP_BOT,   isVerticalGreen,   true, H + CAR_W + 10);
    }

    // ─── Draw helpers ─────────────────────────────────────────────────────────
    function drawRoads() {
      // Horizontal road
      ctx.fillStyle = "#555";
      ctx.fillRect(0, H_ROAD_Y, W, ROAD_W);

      // Vertical road
      ctx.fillStyle = "#555";
      ctx.fillRect(V_ROAD_X, 0, ROAD_W, H);

      // Intersection box (slightly lighter)
      ctx.fillStyle = "#606060";
      ctx.fillRect(IX, IY, IW, IH);

      // Centre dashes — horizontal
      ctx.setLineDash([20, 15]);
      ctx.strokeStyle = "#FFD700";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0,  H_ROAD_Y + LANE_W);
      ctx.lineTo(IX, H_ROAD_Y + LANE_W);
      ctx.moveTo(IX + IW, H_ROAD_Y + LANE_W);
      ctx.lineTo(W,       H_ROAD_Y + LANE_W);
      ctx.stroke();

      // Centre dashes — vertical
      ctx.beginPath();
      ctx.moveTo(V_ROAD_X + LANE_W, 0);
      ctx.lineTo(V_ROAD_X + LANE_W, IY);
      ctx.moveTo(V_ROAD_X + LANE_W, IY + IH);
      ctx.lineTo(V_ROAD_X + LANE_W, H);
      ctx.stroke();

      ctx.setLineDash([]);
    }

    function drawTrafficLights() {
      const BOX_W = 14, BOX_H = 36, R = 5;
      const hc = hColor();
      const vc = vColor();

      // Light for horizontal road — left side of intersection
      drawLightBox(IX - 22, IY - 10, BOX_W, BOX_H, hc, 'H');
      // Light for horizontal road — right side
      drawLightBox(IX + IW + 8, IY + IH - BOX_H + 10, BOX_W, BOX_H, hc, 'H');

      // Light for vertical road — top
      drawLightBox(IX + IW - 4, IY - 44, BOX_H, BOX_W, vc, 'V');
      // Light for vertical road — bottom
      drawLightBox(IX - BOX_H + 4, IY + IH + 8, BOX_H, BOX_W, vc, 'V');
    }

    function drawLightBox(x, y, bw, bh, activeColor, axis) {
      ctx.fillStyle = "#222";
      ctx.fillRect(x, y, bw, bh);

      // Three lights stacked (or side by side for horizontal axis indicator)
      const isV = (axis === 'V');
      const positions = isV
        ? [[x + bw*0.2, y + bh*0.5], [x + bw*0.5, y + bh*0.5], [x + bw*0.8, y + bh*0.5]]
        : [[x + bw*0.5, y + bh*0.2], [x + bw*0.5, y + bh*0.5], [x + bw*0.5, y + bh*0.8]];

      const colors = ['#E74C3C', '#F1C40F', '#2ECC71']; // red, yellow, green
      positions.forEach(([cx, cy], i) => {
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.fillStyle = (activeColor === colors[i]) ? activeColor : '#444';
        ctx.fill();
      });
    }

    function drawCar(car) {
      let x, y, w, h;

      if (car.direction === 'right') {
        x = car.pos; y = LANE_RIGHT_Y; w = CAR_W; h = CAR_H;
      } else if (car.direction === 'left') {
        x = car.pos; y = LANE_LEFT_Y;  w = CAR_W; h = CAR_H;
      } else if (car.direction === 'down') {
        x = LANE_DOWN_X; y = car.pos; w = CAR_H; h = CAR_W;
      } else {
        x = LANE_UP_X;   y = car.pos; w = CAR_H; h = CAR_W;
      }

      // Body
      ctx.fillStyle = car.color;
      ctx.fillRect(x, y, w, h);

      // Windshield
      ctx.fillStyle = "#AED6F1";
      if (car.direction === 'right') {
        ctx.fillRect(x + w - 14, y + 3, 10, h - 6);
      } else if (car.direction === 'left') {
        ctx.fillRect(x + 4,      y + 3, 10, h - 6);
      } else if (car.direction === 'down') {
        ctx.fillRect(x + 3, y + h - 14, w - 6, 10);
      } else {
        ctx.fillRect(x + 3, y + 4,      w - 6, 10);
      }

      // Wheels
      ctx.fillStyle = "#222";
      if (car.direction === 'right' || car.direction === 'left') {
        ctx.fillRect(x + 4,     y + h - 3, 8, 5);
        ctx.fillRect(x + w - 12, y + h - 3, 8, 5);
      } else {
        ctx.fillRect(x + w - 3, y + 4,     5, 8);
        ctx.fillRect(x + w - 3, y + h - 12, 5, 8);
      }
    }

    // ─── Main loop ────────────────────────────────────────────────────────────
    function update() {
      updateLight();
      updateCars();
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      drawRoads();
      drawTrafficLights();
      cars.forEach(drawCar);
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
